<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050b">
<meta name="description" content="EKG 리듬 판독과 가이드라인 기반 대처를 반복 학습하는 교육용 게임">
<title>EKG 리듬 트레이너</title>
<style>
/* src/styles/tokens.css */
:root {
  --bg: #04050b;
  --surface: #0a0f1d;
  --surface-2: #111a2f;
  --text: #dff8ff;
  --muted: #7d91ad;
  --line: #1c2a47;
  --cyan: #22e5ff;
  --pink: #ff2bd6;
  --green: #39ff8e;
  --yellow: #f8f32b;
  --red: #ff3b6b;
  --primary: var(--pink);
  --primary-ink: #0a0010;
  --ok: var(--green);
  --ok-bg: rgb(57 255 142 / .10);
  --bad: var(--red);
  --bad-bg: rgb(255 59 107 / .12);
  --warn: var(--yellow);
  --warn-bg: rgb(248 243 43 / .08);
  --aha: #ff7a9c;
  --kr: #7fb7ff;
  --clin: #b9c6d8;
  --mono:
    ui-monospace,
    "SF Mono",
    "JetBrains Mono",
    Menlo,
    Consolas,
    "D2Coding",
    monospace;
  --cut: 12px;
  --gap: 14px;
  color-scheme: dark;
}

/* src/styles/base.css */
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font:
    16px/1.55 -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    system-ui,
    sans-serif;
  word-break: keep-all;
  overflow-wrap: anywhere;
  background:
    radial-gradient(
      1200px 500px at 50% -10%,
      rgb(255 43 214 / .10),
      transparent 60%),
    radial-gradient(
      900px 600px at 110% 40%,
      rgb(34 229 255 / .07),
      transparent 60%),
    linear-gradient(rgb(34 229 255 / .035) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(
      90deg,
      rgb(34 229 255 / .035) 1px,
      transparent 1px) 0 0 / 32px 100%,
    var(--bg);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 2px,
      rgb(0 0 0 / .18) 3px 3px);
  mix-blend-mode: multiply;
}
h1 {
  font-size: 1.3rem;
  margin: 0;
}
h2,
h3,
h4 {
  margin: 0;
}
p {
  margin: 0;
}
small {
  color: var(--muted);
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}
.muted {
  color: var(--muted);
}
[hidden] {
  display: none !important;
}
::selection {
  background: var(--pink);
  color: #000;
}

/* src/styles/layout.css */
.app {
  max-width: 720px;
  margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
}
.screen {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
.block {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.block-title {
  font: 700 .74rem var(--mono);
  color: var(--cyan);
  letter-spacing: .12em;
  text-transform: uppercase;
  text-shadow: 0 0 8px rgb(34 229 255 / .5);
}
.block-title::before {
  content: "◢ ";
  color: var(--pink);
}
.sub-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sub-head h1 {
  font-family: var(--mono);
  letter-spacing: .02em;
}
.card,
.mode-card,
.seg,
.choice,
.vignette,
.takeaway,
.refs li,
.stats > div,
.lib-item,
.missed,
.scn,
.warn-box,
.pm,
.term {
  --c: var(--cyan);
  background:
    linear-gradient(
      180deg,
      rgb(34 229 255 / .05),
      transparent 60%),
    var(--surface);
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
.card {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card h3 {
  font-size: 1.05rem;
  color: var(--cyan);
  text-shadow: 0 0 10px rgb(34 229 255 / .35);
}
.card h3 small {
  font: 500 .76rem var(--mono);
  color: var(--muted);
  text-shadow: none;
}
.disclaimer {
  font: .72rem var(--mono);
  color: var(--muted);
  text-align: center;
  opacity: .8;
}
.warn-box {
  --c: var(--yellow);
  background: var(--warn-bg);
  color: var(--yellow);
  padding: 10px 12px;
  font-size: .88rem;
}

/* src/styles/buttons.css */
.btn {
  appearance: none;
  cursor: pointer;
  min-height: 46px;
  padding: 10px 18px;
  font: 700 .95rem var(--mono);
  letter-spacing: .04em;
  color: var(--cyan);
  background: rgb(34 229 255 / .06);
  border: 1px solid rgb(34 229 255 / .5);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.btn:hover {
  background: rgb(34 229 255 / .14);
}
.btn.primary {
  background: var(--pink);
  border-color: var(--pink);
  color: var(--primary-ink);
  box-shadow: 0 0 18px rgb(255 43 214 / .45);
}
.btn.primary:hover {
  filter: brightness(1.12);
}
.btn.ghost {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}
.btn.ghost:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}
.btn.small {
  min-height: 38px;
  padding: 6px 12px;
  font-size: .8rem;
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: .4;
  cursor: default;
}
.btn:active {
  transform: translateY(1px);
}
.badge {
  display: inline-block;
  font: 700 .68rem var(--mono);
  letter-spacing: .03em;
  padding: 2px 7px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.badge.ok {
  color: var(--green);
  border-color: rgb(57 255 142 / .5);
}
.badge.draft {
  color: var(--yellow);
  border-color: rgb(248 243 43 / .45);
}
.badge.src-aha {
  color: var(--aha);
  border-color: color-mix(in srgb, var(--aha) 50%, transparent);
}
.badge.src-kr {
  color: var(--kr);
  border-color: color-mix(in srgb, var(--kr) 50%, transparent);
}
.badge.src-clin {
  color: var(--clin);
}

/* src/styles/home.css */
.home-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0 4px;
}
.boot {
  font: .7rem var(--mono);
  color: var(--green);
  letter-spacing: .1em;
  opacity: .85;
}
.glitch {
  position: relative;
  font: 800 1.7rem/1.15 var(--mono);
  letter-spacing: .02em;
  color: var(--text);
  text-shadow: 0 0 12px rgb(255 43 214 / .55);
}
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.glitch::before {
  color: var(--cyan);
  transform: translate(-2px, 0);
  opacity: .55;
  clip-path: inset(0 0 55% 0);
  animation: glitch 3.2s infinite steps(1);
}
.glitch::after {
  color: var(--pink);
  transform: translate(2px, 0);
  opacity: .55;
  clip-path: inset(55% 0 0 0);
  animation: glitch 2.7s infinite steps(1) reverse;
}
@keyframes glitch {
  0%, 92% {
    transform: translate(0);
  }
  93% {
    transform: translate(-3px, 1px);
  }
  96% {
    transform: translate(3px, -1px);
  }
}
.home-head .sub {
  color: var(--muted);
  font-size: .92rem;
}
.segs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
}
.seg {
  appearance: none;
  text-align: left;
  cursor: pointer;
  padding: 11px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  --c: var(--line);
}
.seg b {
  font-family: var(--mono);
}
.seg.on {
  --c: var(--pink);
  box-shadow: inset 0 0 22px rgb(255 43 214 / .18);
}
.seg.on b {
  color: var(--pink);
  text-shadow: 0 0 8px rgb(255 43 214 / .6);
}
.seg small {
  font-size: .74rem;
}
.modes {
  display: grid;
  gap: 8px;
}
.mode-card {
  appearance: none;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  min-height: 64px;
}
.mode-card:hover:not(:disabled) {
  --c: var(--pink);
  box-shadow: inset 0 0 26px rgb(255 43 214 / .15);
}
.mode-card:disabled {
  opacity: .45;
  cursor: default;
}
.mode-icon {
  font-size: 1.5rem;
  width: 2rem;
  text-align: center;
  filter: drop-shadow(0 0 6px rgb(34 229 255 / .6));
}
.mode-body {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.mode-body b {
  font-family: var(--mono);
  letter-spacing: .03em;
}
.mode-extra {
  font: 700 .76rem var(--mono);
  color: var(--yellow);
  white-space: nowrap;
  text-shadow: 0 0 8px rgb(248 243 43 / .4);
}
.meter {
  height: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  background:
    linear-gradient(
      90deg,
      var(--cyan),
      var(--green));
  box-shadow: 0 0 12px var(--green);
}
.progress .muted {
  font: .8rem var(--mono);
}
.settings {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.switch,
.select-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  cursor: pointer;
  font: .85rem var(--mono);
}
.switch {
  margin-right: auto;
}
.switch input {
  width: 18px;
  height: 18px;
  accent-color: var(--pink);
}
.select-row select {
  padding: 6px 8px;
  background: var(--surface);
  color: var(--cyan);
  border: 1px solid rgb(34 229 255 / .5);
  font: .82rem var(--mono);
}
@media (min-width: 560px) {
  .modes {
    grid-template-columns: 1fr 1fr;
  }
}
@media (prefers-reduced-motion: reduce) {
  .glitch::before,
  .glitch::after {
    animation: none;
  }
}
.stars {
  font: 700 .8rem var(--mono);
  color: var(--yellow);
  letter-spacing: .05em;
  text-shadow: 0 0 8px rgb(248 243 43 / .45);
}
.stage-step .stars {
  margin-right: 8px;
}
.verdicts .stars {
  margin-left: auto;
  align-self: center;
}
.segs.levels {
  grid-template-columns: repeat(3, 1fr);
}
.segs.levels .seg {
  padding: 10px;
}
.segs.levels small {
  font-size: .7rem;
}
.switch.mix {
  font-size: .8rem;
  color: var(--muted);
  margin: 0;
}
.switch.mix input:disabled + span {
  opacity: .6;
}
@media (max-width: 420px) {
  .segs.levels {
    grid-template-columns: 1fr;
  }
  .segs.levels .seg {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 8px;
  }
  .segs.levels small {
    flex-basis: 100%;
  }
}
.auto-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid rgb(248 243 43 / .35);
  background: rgb(248 243 43 / .05);
}
.auto-box p {
  font: .85rem var(--mono);
}
.auto-box .skill {
  color: var(--yellow);
}
.auto-box .meter-fill {
  background:
    linear-gradient(
      90deg,
      var(--yellow),
      var(--pink));
  box-shadow: 0 0 12px var(--pink);
}
.muted-levels .seg {
  opacity: .55;
}
.muted-levels .seg.auto-now {
  opacity: 1;
  --c: var(--yellow);
}
.muted-levels .seg.auto-now b {
  color: var(--yellow);
}
.who {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
  font-size: 1.02rem;
  color: var(--text);
  margin-top: 4px;
}
.who-edit {
  margin-left: auto;
  min-height: 32px;
  padding: 4px 10px;
  font-size: .74rem;
}
.who .nick {
  font-family: var(--mono);
  color: var(--yellow);
  text-shadow: 0 0 8px rgb(248 243 43 / .4);
}
.welcome-card {
  gap: 12px;
}
.welcome-card .term-input {
  font-size: 1.15rem;
}

/* src/styles/patient-monitor.css */
.pm {
  --c: var(--cyan);
  display: grid;
  grid-template-columns: 1fr 96px;
  background: #02060a;
  padding: 0;
  box-shadow: inset 0 0 40px rgb(34 229 255 / .06);
}
.pm-waves {
  position: relative;
  display: grid;
  grid-template-rows: 112px 50px 62px;
  border-right: 1px solid #12223a;
}
.ch {
  position: relative;
  border-bottom: 1px solid #0d1a2c;
  overflow: hidden;
}
.ch:last-child {
  border-bottom: 0;
}
.ch canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.ch-trace {
  filter: drop-shadow(0 0 2.5px currentColor);
}
.ch-label {
  position: absolute;
  left: 7px;
  top: 3px;
  font: 700 .66rem var(--mono);
  letter-spacing: .08em;
  opacity: .9;
  text-shadow: 0 0 6px currentColor;
}
.numerics {
  display: grid;
  grid-template-rows: 112px 50px 62px;
}
.num {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  padding: 2px 8px;
  border-bottom: 1px solid #0d1a2c;
  color: var(--c);
  font-family: var(--mono);
  line-height: 1.05;
  text-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent);
}
.num:last-child {
  border-bottom: 0;
}
.num-label {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .08em;
  opacity: .85;
  align-self: flex-start;
}
.num-value {
  font-size: 1.9rem;
  font-weight: 800;
}
.num-pleth .num-value {
  font-size: 1.35rem;
}
.num-art .num-value {
  font-size: .98rem;
}
.num-sub {
  font-size: .66rem;
  opacity: .85;
}
@media (min-width: 560px) {
  .pm {
    grid-template-columns: 1fr 128px;
  }
  .pm-waves,
  .numerics {
    grid-template-rows: 150px 70px 84px;
  }
  .num-value {
    font-size: 2.6rem;
  }
  .num-pleth .num-value {
    font-size: 1.8rem;
  }
  .num-art .num-value {
    font-size: 1.3rem;
  }
}
.pm-alarm {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  font: 800 .8rem var(--mono);
  letter-spacing: .1em;
  white-space: nowrap;
  color: #000;
  background: var(--red);
  padding: 2px 10px;
  box-shadow: 0 0 16px var(--red);
  animation: alarm 1s steps(1) infinite;
}
@keyframes alarm {
  50% {
    background: transparent;
    color: var(--red);
  }
}
@media (prefers-reduced-motion: reduce) {
  .pm-alarm {
    animation: none;
  }
}

/* src/styles/play.css */
.play-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-tag {
  font: .74rem var(--mono);
  color: var(--muted);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hud {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 .95rem var(--mono);
  white-space: nowrap;
}
.hud-lives {
  color: var(--red);
  letter-spacing: 1px;
  text-shadow: 0 0 8px var(--red);
}
.hud-combo {
  color: var(--yellow);
  text-shadow: 0 0 8px var(--yellow);
}
.hud-score {
  color: var(--cyan);
  text-shadow: 0 0 8px rgb(34 229 255 / .6);
}
.sticky-monitor {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
  padding: 4px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sticky-monitor.unpinned {
  position: static;
}
.timer {
  height: 5px;
  background: var(--surface-2);
  overflow: hidden;
}
.timer-fill {
  height: 100%;
  width: 100%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  transition: width .1s linear;
}
.timer.warn .timer-fill {
  background: var(--red);
  box-shadow: 0 0 10px var(--red);
}
.stage {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.stage-step {
  font: 700 .74rem var(--mono);
  color: var(--pink);
  letter-spacing: .08em;
  text-shadow: 0 0 8px rgb(255 43 214 / .5);
}
.vignette {
  --c: var(--pink);
  border-left: 3px solid var(--pink);
  padding: 10px 12px;
}
.vignette.small {
  font-size: .9rem;
  --c: var(--line);
}
.vitals-line {
  font: .8rem var(--mono);
  color: var(--cyan);
}
.vitals-line.none {
  color: var(--red);
}
.prompt {
  font-size: 1.12rem;
}
.feedback {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.feedback:empty {
  display: none;
}
.fb {
  font: 700 1rem var(--mono);
}
.fb.ok {
  color: var(--green);
  text-shadow: 0 0 10px rgb(57 255 142 / .6);
}
.fb.bad {
  color: var(--red);
  text-shadow: 0 0 10px rgb(255 59 107 / .6);
}

/* src/styles/choices.css */
.choices {
  display: grid;
  gap: 8px;
}
.choice {
  appearance: none;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 54px;
  padding: 10px 12px;
  --c: var(--line);
  transition: box-shadow .15s, opacity .15s;
}
.choice:not(:disabled):not(.typing):hover {
  --c: var(--cyan);
  box-shadow: inset 0 0 22px rgb(34 229 255 / .14);
}
.choice:not(:disabled):active {
  transform: translateY(1px);
}
.choice:disabled,
.choice.typing {
  cursor: default;
}
.choice-num {
  flex: none;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  font: 800 .8rem var(--mono);
  color: var(--cyan);
  border: 1px solid rgb(34 229 255 / .55);
}
.choice-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.choice-main {
  font-weight: 600;
}
.choice-sub {
  font: .74rem var(--mono);
  color: var(--muted);
}
.choice-key {
  font: 700 .82rem var(--mono);
  color: var(--yellow);
  letter-spacing: .02em;
}
.key-typed {
  color: var(--green);
  text-shadow: 0 0 8px var(--green);
}
.choice.is-match {
  --c: var(--yellow);
  box-shadow: inset 0 0 22px rgb(248 243 43 / .12);
}
.choice.is-dim {
  opacity: .4;
}
.choice.is-answer {
  --c: var(--green);
  background: var(--ok-bg);
  box-shadow: inset 0 0 24px rgb(57 255 142 / .18);
}
.choice.is-answer .choice-num {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}
.choice.is-wrong {
  --c: var(--red);
  background: var(--bad-bg);
}
.choice.is-wrong .choice-num {
  background: var(--red);
  color: #000;
  border-color: var(--red);
}
.choice:disabled:not(.is-answer):not(.is-wrong) {
  opacity: .45;
}

/* src/styles/typing.css */
.term-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.term {
  --c: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 12px;
  background: #020805;
  box-shadow: inset 0 0 20px rgb(57 255 142 / .10);
